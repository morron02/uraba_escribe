<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller de Escritores Urabá Escribe</title>
    <link rel="icon" type="image/png" href="favicon.png">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --bg-color: #fcfcfc;
            --text-color: #0a0a0a;
            --accent-color: #d91c1c;
            --nav-bg: rgba(252, 252, 252, 0.9);
            --border-color: #e0e0e0;
            --nav-height: 72px;
        }

        body.dark-mode {
            --bg-color: #0a0a0a;
            --text-color: #fcfcfc;
            --nav-bg: rgba(10, 10, 10, 0.9);
            --border-color: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'DM Sans', sans-serif;
            overflow-x: hidden;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* ── NAVEGACIÓN ── */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            height: var(--nav-height);
            position: fixed;
            width: 100%;
            z-index: 100;
            background-color: var(--nav-bg);
            backdrop-filter: blur(10px);
            transition: background-color 0.5s ease;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.3;
        }

        .logo span {
            color: var(--accent-color);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 2.5rem;
        }

        .menu-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .menu-links a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .menu-links a:hover {
            color: var(--accent-color);
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--text-color);
            padding: 0.5rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            flex-shrink: 0;
        }

        .theme-toggle:hover {
            background-color: var(--text-color);
        }

        .theme-toggle svg {
            width: 18px;
            height: 18px;
            stroke: var(--text-color);
            transition: stroke 0.3s ease;
        }

        .theme-toggle:hover svg {
            stroke: var(--bg-color);
        }

        body:not(.dark-mode) .icon-moon { display: none; }
        body:not(.dark-mode) .icon-sun  { display: block; }
        body.dark-mode .icon-sun        { display: none; }
        body.dark-mode .icon-moon       { display: block; }

        /* ── HAMBURGER (solo móvil) ── */
        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 18px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 200;
        }

        .hamburger span {
            display: block;
            height: 2px;
            width: 100%;
            background-color: var(--text-color);
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .hamburger.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .hamburger.open span:nth-child(2) { opacity: 0; }
        .hamburger.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

        /* Menú móvil desplegable */
        .mobile-menu {
            display: none;
            position: fixed;
            top: var(--nav-height);
            left: 0;
            width: 100%;
            background-color: var(--nav-bg);
            backdrop-filter: blur(10px);
            z-index: 99;
            padding: 2rem 5% 2.5rem;
            flex-direction: column;
            gap: 0;
            border-top: 1px solid var(--border-color);
            transform: translateY(-10px);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .mobile-menu.open {
            opacity: 1;
            transform: translateY(0);
        }

        .mobile-menu li {
            list-style: none;
            border-bottom: 1px solid var(--border-color);
        }

        .mobile-menu a {
            display: block;
            padding: 1.1rem 0;
            color: var(--text-color);
            text-decoration: none;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .mobile-menu a:hover {
            color: var(--accent-color);
        }

        /* ── HERO ── */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: calc(var(--nav-height) + 2rem) 5% 4rem;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 6.5rem;
            font-weight: 400;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            opacity: 0;
            transform: translateY(30px);
        }

        .hero-title i {
            font-style: italic;
            opacity: 0.7;
        }

        .hero-subtitle {
            font-weight: 300;
            font-size: 1.1rem;
            max-width: 500px;
            line-height: 1.6;
            opacity: 0;
            transform: translateY(20px);
            color: inherit;
        }

        .btn-explorar {
            margin-top: 3rem;
            padding: 1rem 3rem;
            border: 1px solid var(--text-color);
            background: transparent;
            color: var(--text-color);
            font-family: 'DM Sans', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.4s ease;
            opacity: 0;
        }

        .btn-explorar:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        /* ── MANIFESTO ── */
        .manifesto {
            padding: 0rem 5% 10rem;
            overflow: hidden;
        }

        .manifesto-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-rows: auto auto;
            row-gap: 5rem;
        }

        .m-row-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 2rem;
        }

        .m-left {
            flex: 1;
        }

        .m-right {
            text-align: right;
            flex-shrink: 0;
            opacity: 0;
            transform: translateY(30px);
            padding-bottom: 0.5rem;
            align-self: flex-end;
            margin-bottom: -1rem;
        }

        .m-line {
            display: block;
            font-family: 'Playfair Display', serif;
            line-height: 1.05;
            opacity: 0;
            transform: translateY(40px);
            will-change: transform, opacity;
        }

        .m-large {
            font-size: clamp(2rem, 4vw, 3.2rem);
            font-weight: 400;
            color: var(--text-color);
            margin-bottom: 0.2rem;
        }

        .m-xlarge {
            font-size: clamp(3.8rem, 8.5vw, 7rem);
            font-weight: 600;
            letter-spacing: -2px;
            color: var(--text-color);
        }

        .m-xlarge.m-indent {
            padding-left: clamp(2rem, 8vw, 9rem);
        }

        .m-accent {
            font-size
